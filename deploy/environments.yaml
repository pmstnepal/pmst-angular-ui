# ═══════════════════════════════════════════════════════════════════════════
#  Frontend deployment config for ALL environments (single source of truth).
#  CI picks the block matching the branch: test → test, main → prod.
#  apiUrl/cfDomain are injected into the Angular environment file at build time.
# ═══════════════════════════════════════════════════════════════════════════
test:
  bucket: pmst-test-frontend
  buildConfiguration: test
  envFile: src/environments/environment.test.ts
  production: false
  apiUrl: "https://t529isqhyc.execute-api.us-east-1.amazonaws.com/test/api"
  ticketingUrl: "https://t529isqhyc.execute-api.us-east-1.amazonaws.com/test/tickets"
  cfDomain: "https://d3p3q3lvpevw39.cloudfront.net"
  region: us-east-1

prod:
  bucket: pmst-prod-frontend
  buildConfiguration: production
  envFile: src/environments/environment.prod.ts
  production: true
  apiUrl: "https://q9zxosk8f9.execute-api.us-east-1.amazonaws.com/prod/api"
  ticketingUrl: "https://q9zxosk8f9.execute-api.us-east-1.amazonaws.com/prod/tickets"
  cfDomain: "https://d2f5kzshaq1nf6.cloudfront.net"
  region: us-east-1
