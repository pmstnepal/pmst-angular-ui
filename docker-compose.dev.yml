version: '3.8'

services:
  # Angular Frontend (Development with hot reload)
  frontend:
    image: node:20-alpine
    container_name: pmst-frontend-dev
    working_dir: /app
    command: sh -c "npm install && ng serve --host 0.0.0.0 --port 4201 --disable-host-check"
    ports:
      - "4201:4201"
    volumes:
      - .:/app
      - /app/node_modules  # Preserve node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true  # Fix for Windows file watching
    networks:
      - pmst-network

  # Backend API (Development)
  backend:
    image: maven:3.9-eclipse-temurin-21-alpine
    container_name: pmst-api-dev
    working_dir: /app
    command: mvn spring-boot:run
    ports:
      - "8080:8080"
    volumes:
      - ../pmst-services/pmst-api-service:/app
      - ~/.m2:/root/.m2  # Cache Maven dependencies
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pmst
      - SPRING_DATASOURCE_USERNAME=pmst
      - SPRING_DATASOURCE_PASSWORD=pmst
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pmst-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pmst-postgres-dev
    environment:
      POSTGRES_DB: pmst
      POSTGRES_USER: pmst
      POSTGRES_PASSWORD: pmst
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../pmst-services/pmst-api-service/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmst"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pmst-network

networks:
  pmst-network:
    driver: bridge

volumes:
  postgres_dev_data:
